name: Сборка SteamPACC

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Сборка установщика
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Проверка тестов
        shell: bash
        run: |
          set +e
          python -m pytest -q
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "Тестов пока нет — шаг пропущен."
            exit 0
          fi
          exit $code

      - name: Сборка исполняемых файлов
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SteamPACC --paths src src/steampacc/__main__.py
          pyinstaller --noconfirm --clean --onefile --console --name SteamPACC-Console --paths src src/steampacc/__main__.py

      - name: Проверка собранной программы без графики
        shell: bash
        run: |
          ./dist/SteamPACC-Console.exe --selftest
          code=$?
          echo "Код самопроверки: $code"
          echo "--- Журнал программы ---"
          cat "$APPDATA/SteamPACC/steampacc.log" || echo "Журнала нет"
          echo "--- Отчёт самопроверки ---"
          cat "$APPDATA/SteamPACC/samoproverka.txt" || echo "Отчёта нет"
          exit $code

      - name: Проверка графической части на Windows
        shell: bash
        continue-on-error: true
        run: |
          set +e
          ./dist/SteamPACC-Console.exe --smoke
          code=$?
          echo "Код проверки графики: $code"
          echo "--- Журнал программы ---"
          cat "$APPDATA/SteamPACC/steampacc.log" || echo "Журнала нет"
          mkdir -p diagnostics
          cp -r "$APPDATA/SteamPACC/." diagnostics/ 2>/dev/null || echo "Отчётов нет"

      - name: Сбор отчётов проверки
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          cp -r "$APPDATA/SteamPACC/." diagnostics/ 2>/dev/null || echo "Отчётов нет"
          cat diagnostics/steampacc.log 2>/dev/null || true

      - name: Сохранение отчётов проверки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: diagnostics
          if-no-files-found: warn

      - name: Установка Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Сборка установщика
        shell: bash
        run: |
          ISCC=""
          for candidate in "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/c/Program Files/Inno Setup 6/ISCC.exe"; do
            if [ -f "$candidate" ]; then
              ISCC="$candidate"
              break
            fi
          done
          if [ -z "$ISCC" ]; then
            echo "Ошибка: Inno Setup 6 не найден. Проверенные пути: /c/Program Files (x86)/Inno Setup 6/ISCC.exe и /c/Program Files/Inno Setup 6/ISCC.exe" >&2
            exit 1
          fi
          echo "Используется ISCC: $ISCC"
          "$ISCC" installer/SteamPACC.iss

      - name: Сохранение установщика как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: SteamPACC-Setup
          path: dist/SteamPACC-Setup-*.exe
          if-no-files-found: error

      - name: "Проверка установщика: установка, автозапуск, удаление"
        shell: bash
        run: |
          # Ограничение по времени: установщик в тихом режиме может ждать
          # закрытия программы и висеть бесконечно.
          # Вывод программы перенаправляем в файл, а stdin закрываем: иначе
          # запущенное приложение держит канал шага открытым, и CI зависает
          # в ожидании конца вывода.
          with_timeout() {
            limit="$1"
            shift
            log="$RUNNER_TEMP/step.log"
            : > "$log"
            "$@" > "$log" 2>&1 < /dev/null &
            pid=$!
            waited=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$waited" -ge "$limit" ]; then
                echo "ТАЙМАУТ ${limit}c: $*"
                taskkill //IM SteamPACC.exe //F 2>/dev/null || true
                kill -9 "$pid" 2>/dev/null || true
                echo "--- вывод команды ---"
                cat "$log" || true
                return 124
              fi
              sleep 5
              waited=$((waited + 5))
            done
            wait "$pid"
            code=$?
            echo "--- вывод команды ---"
            cat "$log" || true
            return $code
          }

          taskkill //IM SteamPACC.exe //F 2>/dev/null || true
          setup=$(ls dist/SteamPACC-Setup-*.exe | head -1)
          echo "=== Устанавливаем: $setup ==="
          with_timeout 300 "$setup" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART || {
            echo "ОШИБКА: установщик не отработал"
            exit 1
          }
          echo "=== Установщик отработал ==="

          appid="{7B1F5C8E-2C4A-4A1E-9E3D-2E9C4B8A7D31}_is1"
          location=""
          for root in "HKCU" "HKLM"; do
            value=$(reg query "$root\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\$appid" //v InstallLocation 2>/dev/null | tr -d '\\r' | sed -n 's/.*REG_SZ *//p')
            if [ -n "$value" ]; then
              location="$value"
              break
            fi
          done
          echo "Каталог установки: $location"
          if [ -z "$location" ]; then
            echo "ОШИБКА: установщик не записал каталог установки в реестр"
            exit 1
          fi

          exe="$location\\SteamPACC.exe"
          if [ ! -f "$exe" ]; then
            echo "ОШИБКА: нет файла программы: $exe"
            exit 1
          fi
          echo "OK: программа установлена: $exe"

          runvalue=$(reg query "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run" //v SteamPACC 2>/dev/null | tr -d '\\r' | sed -n 's/.*REG_SZ *//p')
          echo "Автозапуск: $runvalue"
          if [ -z "$runvalue" ]; then
            echo "ОШИБКА: ключ автозапуска SteamPACC не создан"
            exit 1
          fi
          case "$runvalue" in
            *--autostart*) echo "OK: в автозапуске есть --autostart" ;;
            *) echo "ОШИБКА: в автозапуске нет --autostart"; exit 1 ;;
          esac
          case "$runvalue" in
            *"$exe"*) echo "OK: в автозапуске полный путь к программе" ;;
            *) echo "ОШИБКА: в автозапуске нет полного пути к программе"; exit 1 ;;
          esac

          if tasklist | grep -qi SteamPACC.exe; then
            echo "OK: процесс SteamPACC.exe запущен сразу после установки"
          else
            echo "ВНИМАНИЕ: процесс SteamPACC.exe не найден сразу после установки"
          fi

          rm -f "$APPDATA/SteamPACC/samoproverka.txt" 2>/dev/null || true
          with_timeout 60 "$exe" --selftest || echo "Приложение ответило кодом: $?"
          if [ -f "$APPDATA/SteamPACC/samoproverka.txt" ]; then
            echo "OK: установленная программа отвечает на --selftest"
          else
            echo "ОШИБКА: установленная программа не отвечает"
            exit 1
          fi
          if grep -q "Traceback" "$APPDATA/SteamPACC/steampacc.log" 2>/dev/null; then
            echo "ОШИБКА: в журнале программы есть Traceback"
            cat "$APPDATA/SteamPACC/steampacc.log" || true
            exit 1
          fi
          echo "OK: в журнале программы нет Traceback"

          echo "=== Удаляем программу ==="
          taskkill //IM SteamPACC.exe //F 2>/dev/null || true
          sleep 2
          uninstaller=$(ls "$location"/unins*.exe 2>/dev/null | head -1)
          if [ -z "$uninstaller" ]; then
            echo "ОШИБКА: деинсталлятор не найден"
            exit 1
          fi
          with_timeout 180 "$uninstaller" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART || echo "Деинсталлятор вернул код: $?"
          taskkill //IM SteamPACC.exe //F 2>/dev/null || true
          left=$(reg query "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run" //v SteamPACC 2>/dev/null | tr -d '\\r' | sed -n 's/.*REG_SZ *//p')
          if [ -n "$left" ]; then
            echo "ОШИБКА: после удаления ключ автозапуска остался: $left"
            exit 1
          fi
          echo "OK: после удаления ключ автозапуска исчез"

      - name: Сохранение диагностической сборки
        uses: actions/upload-artifact@v4
        with:
          name: SteamPACC-Console
          path: dist/SteamPACC-Console.exe
          if-no-files-found: warn

      - name: Публикация релиза
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/SteamPACC-Setup-*.exe --generate-notes --title "${{ github.ref_name }}" --verify-tag
